name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-universal
            architecture: universal
          - os: windows-2022
            platform: Windows-x64
            architecture: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DSTRIP_EDITOR_CHECK=ON
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DSTRIP_EDITOR_CHECK=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check editor and state
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          "build/strip-editor-check_artefacts/Release/strip-editor-check${suffix}" build/editor.png

      - name: Sign and verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          output=build/Riga_artefacts/Release
          for bundle in "$output/VST3/Riga.vst3" "$output/Standalone/Riga.app"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
            lipo "$bundle/Contents/MacOS/Riga" -verify_arch arm64 x86_64
          done

      - name: Package
        run: python tools/package.py --architecture "${{ matrix.architecture }}"

      - name: Upload builds
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Riga-${{ matrix.platform }}
          path: dist/Riga-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/
            build/editor.png
          if-no-files-found: ignore

  dsp-linux:
    name: Linux DSP checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DSTRIP_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dsp-linux]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download validated builds
        run: gh run download "$GITHUB_RUN_ID" --pattern 'Riga-*' --dir release-assets
      - name: Publish archives
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Riga ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*/* --clobber
