name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux-x64
            architecture: x64
          - os: windows-2022
            platform: Windows-x64
            architecture: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libjack-jackd2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev xvfb xauth

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSTRIP_EDITOR_CHECK=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DSTRIP_EDITOR_CHECK=ON

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cmake --build build --config Release --parallel 2
          else
            cmake --build build --config Release --parallel 2
          fi

      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check editor and state
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a build/strip-editor-check_artefacts/Release/strip-editor-check build/editor.png
          else
            "build/strip-editor-check_artefacts/Release/strip-editor-check${suffix}" build/editor.png
          fi

      - name: Package
        run: python tools/package.py --architecture "${{ matrix.architecture }}"

      - name: Upload builds
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Riga-${{ matrix.platform }}
          path: dist/Riga-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/
            build/editor.png
          if-no-files-found: ignore

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download validated builds
        run: gh run download "$GITHUB_RUN_ID" --pattern 'Riga-*' --dir release-assets
      - name: Publish archives
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Riga $GITHUB_REF_NAME" --draft \
              --notes "Windows and Linux builds validated by GitHub Actions. macOS assets are added from a local build before publication."
          gh release upload "$GITHUB_REF_NAME" release-assets/*/* --clobber
